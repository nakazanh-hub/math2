    <script>
        // Google Apps Script WEB API URL
        const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzNzl-jIb9R-vUpLClfhBWIRFWU9IjK6PNr_TS048PYV88TtXMx0HeREBftEf0QY_VzdQ/exec";

        const TOTAL_QUESTIONS = 5;
        let currentQuestion = null;
        let questionCount = 0;
        let correctCount = 0;
        let currentStreak = 0;
        let isAnswered = false;
        let isHintVisible = false;

        let userInfo = {
            grade: "1",
            classNum: "1",
            number: "1",
            name: ""
        };

        const SVG_NS = "http://www.w3.org/2000/svg";

        const svg = document.getElementById('plane-svg');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const nextBtnText = document.getElementById('next-btn-text');

        const questionBadge = document.getElementById('question-badge');
        const explanationPanel = document.getElementById('explanation-panel');
        const feedbackHeader = document.getElementById('feedback-header');
        const explanationBody = document.getElementById('explanation-body');
        const answerInput = document.getElementById('answer-input');
        const clearBtn = document.getElementById('clear-btn');

        const toggleHintBtn = document.getElementById('toggle-hint-btn');
        const hintBtnText = document.getElementById('hint-btn-text');
        const hintContainer = document.getElementById('hint-container');

        const scoreCorrect = document.getElementById('score-correct');
        const scoreAccuracy = document.getElementById('score-accuracy');
        const scoreStreak = document.getElementById('score-streak');

        const questionCard = document.getElementById('question-card');

        const helpBtn = document.getElementById('help-btn');
        const helpModal = document.getElementById('help-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalOkBtn = document.getElementById('modal-ok-btn');

        // ユーザー設定DOM
        const userSettingsBtn = document.getElementById('user-settings-btn');
        const userDisplayName = document.getElementById('user-display-name');
        const userModal = document.getElementById('user-modal');
        const selectGrade = document.getElementById('select-grade');
        const selectClass = document.getElementById('select-class');
        const selectNumber = document.getElementById('select-number');
        const inputName = document.getElementById('input-name');
        const saveUserBtn = document.getElementById('save-user-btn');

        // 結果モーダルDOM
        const resultModal = document.getElementById('result-modal');
        const resultTitle = document.getElementById('result-title');
        const resultUserInfo = document.getElementById('result-user-info');
        const resultScore = document.getElementById('result-score');
        const resultDetail = document.getElementById('result-detail');

        const resultCloseBtn = document.getElementById('result-close-btn');

        function initUserSettingsUI() {
            selectGrade.innerHTML = [1,2,3].map(n => `<option value="${n}">${n}年</option>`).join('');
            selectClass.innerHTML = Array.from({length: 9}, (_, i) => `<option value="${i+1}">${i+1}組</option>`).join('');
            selectNumber.innerHTML = Array.from({length: 40}, (_, i) => `<option value="${i+1}">${i+1}番</option>`).join('');

            const saved = localStorage.getItem('circle_math_user_info');
            if (saved) {
                userInfo = JSON.parse(saved);
                selectGrade.value = userInfo.grade;
                selectClass.value = userInfo.classNum;
                selectNumber.value = userInfo.number;
                inputName.value = userInfo.name;
                updateUserDisplay();
            } else {
                userModal.classList.remove('hidden');
                userModal.classList.add('flex');
            }
        }

        function updateUserDisplay() {
            if (userInfo.name) {
                userDisplayName.textContent = `${userInfo.grade}-${userInfo.classNum} ${userInfo.name}`;
            } else {
                userDisplayName.textContent = "初期設定";
            }
        }

        saveUserBtn.addEventListener('click', () => {
            if (!inputName.value.trim()) {
                alert("氏名を入力してください");
                return;
            }
            userInfo = {
                grade: selectGrade.value,
                classNum: selectClass.value,
                number: selectNumber.value,
                name: inputName.value.trim()
            };
            localStorage.setItem('circle_math_user_info', JSON.stringify(userInfo));
            updateUserDisplay();
            userModal.classList.add('hidden');
        });

        userSettingsBtn.addEventListener('click', () => {
            userModal.classList.remove('hidden');
            userModal.classList.add('flex');
        });

        function formatSquareRoot(dSquared) {
            let outside = 1;
            let inside = dSquared;

            for (let i = Math.floor(Math.sqrt(dSquared)); i >= 2; i--) {
                if (inside % (i * i) === 0) {
                    outside *= i;
                    inside /= (i * i);
                }
            }

            if (inside === 1) {
                return `${outside}`;
            } else if (outside === 1) {
                return `√${inside}`;
            } else {
                return `${outside}√${inside}`;
            }
        }

        function formatTexSquareRoot(dSquared) {
            let outside = 1;
            let inside = dSquared;

            for (let i = Math.floor(Math.sqrt(dSquared)); i >= 2; i--) {
                if (inside % (i * i) === 0) {
                    outside *= i;
                    inside /= (i * i);
                }
            }

            if (inside === 1) {
                return `${outside}`;
            } else if (outside === 1) {
                return `\\sqrt{${inside}}`;
            } else {
                return `${outside}\\sqrt{${inside}}`;
            }
        }

        function generateQuestion() {
            const pointPairs = [
                { p1: 'A', p2: 'B' },
                { p1: 'O', p2: 'G' },
                { p1: 'P', p2: 'Q' },
                { p1: 'C', p2: 'D' }
            ];
            const pair = pointPairs[Math.floor(Math.random() * pointPairs.length)];

            let x1, y1, x2, y2, dx, dy, dSquared, answerStr, texAnsStr;
            let valid = false;
            let attempts = 0;

            while (!valid && attempts < 200) {
                attempts++;
                
                if (pair.p1 === 'O') {
                    x1 = 0; y1 = 0;
                    x2 = Math.floor(Math.random() * 6) + 1;
                    y2 = Math.floor(Math.random() * 6) + 1;
                } else {
                    x1 = Math.floor(Math.random() * 7) - 2;
                    y1 = Math.floor(Math.random() * 7) - 2;
                    x2 = Math.floor(Math.random() * 7) - 2;
                    y2 = Math.floor(Math.random() * 7) - 2;
                }

                dx = Math.abs(x2 - x1);
                dy = Math.abs(y2 - y1);
                dSquared = dx * dx + dy * dy;

                if (dx > 0 && dy > 0) {
                    answerStr = formatSquareRoot(dSquared);
                    texAnsStr = formatTexSquareRoot(dSquared);
                    if (!answerStr.includes('√') || answerStr.startsWith('√')) {
                        valid = true;
                    }
                }
            }

            return {
                p1: pair.p1,
                p2: pair.p2,
                x1: x1, y1: y1,
                x2: x2, y2: y2,
                dx: dx, dy: dy,
                dSquared: dSquared,
                answerStr: answerStr,
                texAnsStr: texAnsStr
            };
        }

        function renderCoordinatePlane() {
            svg.innerHTML = '';

            const { x1, y1, x2, y2, dx, dy, p1, p2 } = currentQuestion;

            const minX = Math.min(0, x1, x2) - 2;
            const maxX = Math.max(0, x1, x2) + 2;
            const minY = Math.min(0, y1, y2) - 2;
            const maxY = Math.max(0, y1, y2) + 2;

            const width = 400;
            const height = 400;
            const margin = 40;

            const toSvgX = (x) => margin + (x - minX) * ((width - 2 * margin) / (maxX - minX));
            const toSvgY = (y) => height - (margin + (y - minY) * ((height - 2 * margin) / (maxY - minY)));

            for (let x = Math.ceil(minX); x <= Math.floor(maxX); x++) {
                const line = document.createElementNS(SVG_NS, 'line');
                line.setAttribute('x1', toSvgX(x));
                line.setAttribute('y1', 10);
                line.setAttribute('x2', toSvgX(x));
                line.setAttribute('y2', height - 10);
                line.setAttribute('stroke', x === 0 ? '#475569' : '#e2e8f0');
                line.setAttribute('stroke-width', x === 0 ? '2' : '1');
                svg.appendChild(line);
            }

            for (let y = Math.ceil(minY); y <= Math.floor(maxY); y++) {
                const line = document.createElementNS(SVG_NS, 'line');
                line.setAttribute('x1', 10);
                line.setAttribute('y1', toSvgY(y));
                line.setAttribute('x2', width - 10);
                line.setAttribute('y2', toSvgY(y));
                line.setAttribute('stroke', y === 0 ? '#475569' : '#e2e8f0');
                line.setAttribute('stroke-width', y === 0 ? '2' : '1');
                svg.appendChild(line);
            }

            const cx = x2;
            const cy = y1;

            const dashHorizontal = document.createElementNS(SVG_NS, 'line');
            dashHorizontal.setAttribute('x1', toSvgX(x1));
            dashHorizontal.setAttribute('y1', toSvgY(y1));
            dashHorizontal.setAttribute('x2', toSvgX(cx));
            dashHorizontal.setAttribute('y2', toSvgY(cy));
            dashHorizontal.setAttribute('stroke', '#3b82f6');
            dashHorizontal.setAttribute('stroke-width', '2.5');
            dashHorizontal.setAttribute('stroke-dasharray', '4 4');
            svg.appendChild(dashHorizontal);

            const dashVertical = document.createElementNS(SVG_NS, 'line');
            dashVertical.setAttribute('x1', toSvgX(cx));
            dashVertical.setAttribute('y1', toSvgY(cy));
            dashVertical.setAttribute('x2', toSvgX(x2));
            dashVertical.setAttribute('y2', toSvgY(y2));
            dashVertical.setAttribute('stroke', '#ec4899');
            dashVertical.setAttribute('stroke-width', '2.5');
            dashVertical.setAttribute('stroke-dasharray', '4 4');
            svg.appendChild(dashVertical);

            const hypotenuse = document.createElementNS(SVG_NS, 'line');
            hypotenuse.setAttribute('x1', toSvgX(x1));
            hypotenuse.setAttribute('y1', toSvgY(y1));
            hypotenuse.setAttribute('x2', toSvgX(x2));
            hypotenuse.setAttribute('y2', toSvgY(y2));
            hypotenuse.setAttribute('stroke', '#6366f1');
            hypotenuse.setAttribute('stroke-width', '4');
            hypotenuse.setAttribute('stroke-linecap', 'round');
            svg.appendChild(hypotenuse);

            const midX1 = (toSvgX(x1) + toSvgX(cx)) / 2;
            const midY1 = toSvgY(y1) + (y1 >= y2 ? 18 : -10);
            drawText(midX1, midY1, `${dx}`, '#2563eb', '14px', 'bold');

            const midX2 = toSvgX(cx) + (x2 >= x1 ? 14 : -14);
            const midY2 = (toSvgY(cy) + toSvgY(y2)) / 2;
            drawText(midX2, midY2, `${dy}`, '#db2777', '14px', 'bold');

            const cornerSize = 12;
            const dirX = x1 < x2 ? -1 : 1;
            const dirY = y1 < y2 ? 1 : -1;
            const raPath = document.createElementNS(SVG_NS, 'path');
            const cSvgX = toSvgX(cx);
            const cSvgY = toSvgY(cy);
            raPath.setAttribute('d', `M ${cSvgX + dirX * cornerSize} ${cSvgY} L ${cSvgX + dirX * cornerSize} ${cSvgY + dirY * cornerSize} L ${cSvgX} ${cSvgY + dirY * cornerSize}`);
            raPath.setAttribute('fill', 'none');
            raPath.setAttribute('stroke', '#64748b');
            raPath.setAttribute('stroke-width', '1.5');
            svg.appendChild(raPath);

            drawPointMarker(toSvgX(x1), toSvgY(y1), `${p1}(${x1}, ${y1})`, '#4f46e5');
            drawPointMarker(toSvgX(x2), toSvgY(y2), `${p2}(${x2}, ${y2})`, '#4f46e5');
        }

        function drawPointMarker(x, y, label, color) {
            const circle = document.createElementNS(SVG_NS, 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', '6');
            circle.setAttribute('fill', color);
            svg.appendChild(circle);

            const text = document.createElementNS(SVG_NS, 'text');
            text.setAttribute('x', x);
            text.setAttribute('y', y - 10);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-weight', '800');
            text.setAttribute('font-size', '13');
            text.setAttribute('fill', '#1e1b4b');
            text.textContent = label;
            svg.appendChild(text);
        }

        function drawText(x, y, textStr, color, fontSize = '12px', fontWeight = 'normal') {
            const text = document.createElementNS(SVG_NS, 'text');
            text.setAttribute('x', x);
            text.setAttribute('y', y);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-weight', fontWeight);
            text.setAttribute('font-size', fontSize);
            text.setAttribute('fill', color);
            text.textContent = textStr;
            svg.appendChild(text);
        }

        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isAnswered) return;
                const val = btn.getAttribute('data-val');
                let current = answerInput.value;

                if (val === 'back') {
                    answerInput.value = current.slice(0, -1);
                } else if (val === '√') {
                    if (!current.includes('√')) {
                        answerInput.value = '√' + current;
                    }
                } else {
                    if (current.length < 6) {
                        answerInput.value = current + val;
                    }
                }

                submitBtn.disabled = answerInput.value.trim() === '';
            });
        });

        clearBtn.addEventListener('click', () => {
            if (isAnswered) return;
            answerInput.value = '';
            submitBtn.disabled = true;
        });

        toggleHintBtn.addEventListener('click', () => {
            isHintVisible = !isHintVisible;
            if (isHintVisible) {
                hintContainer.classList.remove('hidden');
                hintBtnText.textContent = "平面図形ヒントを隠す";
                toggleHintBtn.classList.replace('bg-amber-50', 'bg-slate-200');
                toggleHintBtn.classList.replace('text-amber-700', 'text-slate-700');
                renderCoordinatePlane();
            } else {
                hintContainer.classList.add('hidden');
                hintBtnText.textContent = "平面図形ヒントを表示";
                toggleHintBtn.classList.replace('bg-slate-200', 'bg-amber-50');
                toggleHintBtn.classList.replace('text-slate-700', 'text-amber-700');
            }
        });

        function hideHintArea() {
            isHintVisible = false;
            hintContainer.classList.add('hidden');
            hintBtnText.textContent = "平面図形ヒントを表示";
            toggleHintBtn.classList.replace('bg-slate-200', 'bg-amber-50');
            toggleHintBtn.classList.replace('text-slate-700', 'text-amber-700');
        }

        function resetQuizState() {
            questionCount = 0;
            correctCount = 0;
            currentStreak = 0;
            scoreCorrect.textContent = "0 / 5";
            scoreAccuracy.textContent = "0%";
            scoreStreak.textContent = "0 🔥";
            resultModal.classList.add('hidden');
            loadNewQuestion();
        }

        function loadNewQuestion() {
            if (questionCount >= TOTAL_QUESTIONS) {
                finishQuizAndSendResult();
                return;
            }

            isAnswered = false;
            answerInput.value = '';
            submitBtn.disabled = true;
            explanationPanel.classList.add('hidden');
            
            hideHintArea();

            currentQuestion = generateQuestion();
            questionCount++;

            questionBadge.textContent = `第 ${questionCount} / ${TOTAL_QUESTIONS} 問`;

            const { p1, p2, x1, y1, x2, y2 } = currentQuestion;
            questionText.innerHTML = `2点 <span id="katex-p1"></span>, <span id="katex-p2"></span> の間の距離を求めなさい。`;

            katex.render(`${p1}(${x1}, ${y1})`, document.getElementById('katex-p1'));
            katex.render(`${p2}(${x2}, ${y2})`, document.getElementById('katex-p2'));
            katex.render(`a^2 + b^2 = c^2`, document.getElementById('katex-hint-eq'));

            if (questionCount === TOTAL_QUESTIONS) {
                nextBtnText.textContent = "結果を見る";
            } else {
                nextBtnText.textContent = "次の問題へ";
            }
        }

        // 全問終了処理 & スプレッドシート送信
        function finishQuizAndSendResult() {
            if (!userInfo.name) {
                alert("送信に必要なユーザー情報が入力されていません。初期設定を行ってください。");
                userModal.classList.remove('hidden');
                userModal.classList.add('flex');
                return;
            }

            const ratePercent = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            const scoreRateStr = `${ratePercent}% (${correctCount}/${TOTAL_QUESTIONS}問)`;
            const modeNameStr = "2点間の距離マスター";

            resultTitle.textContent = `5問終了！お疲れ様でした！`;
            resultUserInfo.textContent = `${userInfo.grade}年 ${userInfo.classNum}組 ${userInfo.number}番  ${userInfo.name}`;
            resultScore.textContent = `${ratePercent}%`;
            resultDetail.textContent = `正答数：${correctCount} / ${TOTAL_QUESTIONS} 問`;
            
            sendStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> スプレッドシートへ送信中...`;
            sendStatus.className = "text-xs font-bold text-slate-500 my-3 flex items-center justify-center gap-2";

            resultModal.classList.remove('hidden');
            resultModal.classList.add('flex');

            const payload = {
                grade: userInfo.grade,
                classNum: userInfo.classNum,
                number: userInfo.number,
                name: userInfo.name,
                modeName: modeNameStr,
                scoreRate: scoreRateStr
            };

            fetch(GAS_ENDPOINT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                sendStatus.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> スプレッドシートに送信完了しました！`;
                sendStatus.className = "text-xs font-bold text-emerald-600 my-3 flex items-center justify-center gap-2";
            })
            .catch(err => {
                console.error("送信エラー:", err);
                sendStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i> 送信に失敗しました（ローカル動作確認時等）`;
                sendStatus.className = "text-xs font-bold text-rose-600 my-3 flex items-center justify-center gap-2";
            });
        }

        resultCloseBtn.addEventListener('click', () => {
            resetQuizState();
        });

        function submitAnswer() {
            const userAns = answerInput.value.trim();
            if (!userAns || isAnswered) return;

            isAnswered = true;
            const isCorrect = userAns === currentQuestion.answerStr;

            if (isCorrect) {
                correctCount++;
                currentStreak++;
            } else {
                currentStreak = 0;
            }

            scoreCorrect.textContent = `${correctCount} / ${TOTAL_QUESTIONS}`;
            scoreAccuracy.textContent = `${Math.round((correctCount / questionCount) * 100)}%`;
            scoreStreak.textContent = `${currentStreak} 🔥`;

            explanationPanel.classList.remove('hidden');

            if (isCorrect) {
                feedbackHeader.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-xl">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div>
                        <div class="text-lg font-bold text-emerald-700">正解！素晴らしいです！</div>
                        <div class="text-xs text-slate-500">正解: <span id="katex-header-ans"></span></div>
                    </div>
                `;
            } else {
                feedbackHeader.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-xl">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </div>
                    <div>
                        <div class="text-lg font-bold text-rose-700">不正解！</div>
                        <div class="text-xs text-slate-500">正解は <span id="katex-header-ans"></span> です</div>
                    </div>
                `;
            }
            katex.render(currentQuestion.texAnsStr, document.getElementById('katex-header-ans'));

            const { p1, p2, x1, y1, x2, y2, dx, dy, dSquared, texAnsStr } = currentQuestion;

            explanationBody.innerHTML = `
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                    <div class="font-bold text-slate-800">【計算手順】</div>
                    <div class="text-xs sm:text-sm text-slate-600 space-y-2">
                        <div>・横の長さ <span id="katex-exp-dx"></span></div>
                        <div>・縦の長さ <span id="katex-exp-dy"></span></div>
                    </div>
                    
                    <div class="bg-white p-4 rounded-xl border border-indigo-200 flex justify-center items-center overflow-x-auto text-indigo-900 font-extrabold text-lg">
                        <span id="katex-exp-calc"></span>
                    </div>
                </div>
            `;

            katex.render(`\\Delta x = |${x2} - (${x1})| = ${dx}`, document.getElementById('katex-exp-dx'));
            katex.render(`\\Delta y = |${y2} - (${y1})| = ${dy}`, document.getElementById('katex-exp-dy'));
            katex.render(`${p1}${p2} = \\sqrt{${dx}^2 + ${dy}^2} = \\sqrt{${dx*dx} + ${dy*dy}} = \\sqrt{${dSquared}} = ${texAnsStr}`, document.getElementById('katex-exp-calc'));

            explanationPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        submitBtn.addEventListener('click', submitAnswer);
        nextBtn.addEventListener('click', loadNewQuestion);

        helpBtn.addEventListener('click', () => {
            helpModal.classList.remove('hidden');
            helpModal.classList.add('flex');

            katex.render(`A(x_1, y_1)`, document.getElementById('katex-modal-p1'));
            katex.render(`B(x_2, y_2)`, document.getElementById('katex-modal-p2'));
            katex.render(`AB = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}`, document.getElementById('katex-modal-formula'));
            katex.render(`a = |x_2 - x_1|`, document.getElementById('katex-modal-a'));
            katex.render(`b = |y_2 - y_1|`, document.getElementById('katex-modal-b'));
            katex.render(`c`, document.getElementById('katex-modal-c'));
            katex.render(`c = \\sqrt{a^2 + b^2}`, document.getElementById('katex-modal-pythagoras'));
        });
        closeModalBtn.addEventListener('click', () => helpModal.classList.add('hidden'));
        modalOkBtn.addEventListener('click', () => helpModal.classList.add('hidden'));

        window.addEventListener('DOMContentLoaded', () => {
            initUserSettingsUI();
            resetQuizState();
        });
    </script>
</body>
</html>
